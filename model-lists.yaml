# ~/.hermes/model-lists.yaml
#
# Curated model lists for the NOOZ-Hermes pipeline.
#
# This file is the single source of truth for which OpenRouter models
# hermes should try.  Order matters: hermes uses the FIRST entry as the
# primary, and the rest as automatic fallbacks on timeout / 429 / 529 / 503.
#
# Edit freely, then re-apply with:
#     python3 ~/.hermes/bin/sync-models.py
#
# HARD RULE: do NOT include any model with the ":free" suffix or the
# literal id "openrouter/free".  OpenRouter free tier is unreliable,
# rate-limited, and broken on most providers.  The sync script enforces
# this and refuses to run if a banned id is present.
#
# Format: each entry is the OpenRouter model slug (provider/model-name).
# A bare string is shorthand for { provider: openrouter, model: <slug> }.
# Override provider/base_url/api_mode per-entry by using the dict form:
#   - model: anthropic/claude-sonnet-4.5
#     provider: openrouter

provider: openrouter

# ─── Weak / cheap models ─────────────────────────────────────────────────────
# Used by scout subagents (high-volume, simpler analysis) and as fallback
# for the orchestrator when all strong models fail.  Order = preference.
#
# Suggestions, cheapest-first:
#   - google/gemini-3-flash-preview     cheapest, very fast, decent quality
#   - openai/gpt-4o-mini                reliable, well-tested, $0.15/$0.60 per M
#   - deepseek/deepseek-chat            very cheap, good for structured tasks
#   - anthropic/claude-haiku-4.5        fast Claude, good instruction following
#   - meta-llama/llama-3.3-70b-instruct open weights, cheap on OR
weak:
  - google/gemini-flash-latest
  - deepseek/deepseek-chat
  - anthropic/claude-haiku-4.5
  - meta-llama/llama-3.3-70b-instruct

# ─── Strong models ───────────────────────────────────────────────────────────
# Used by the orchestrator / curator / editor / evolution step (synthesis,
# curation, autonomous evolution).  Order = preference.
#
# Suggestions, strongest-first:
#   - deepseek/deepseek-chat             current default (DeepSeek V4 Pro)
#   - minimax/minimax-m3                 very strong
#   - anthropic/claude-sonnet-4.5        top-tier reasoning, prompt caching
#   - openai/gpt-5                       strong all-rounder (check OR availability)
#   - google/gemini-2.5-pro              large context, strong reasoning
#   - z-ai/glm-5                         Z.AI flagship, cheap for its size
strong:
  - deepseek/deepseek-v4-pro
  - minimax/minimax-m3
  - z-ai/glm-5.2
  - anthropic/claude-sonnet-4.5
  - google/gemini-2.5-pro
  - openai/gpt-5
